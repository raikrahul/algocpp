project:
  name: algocpp
  language: cpp
  standard: c++17

build:
  system: cmake
  min_version: 3.15
  build_dir: build
  output_dir: bin

compiler:
  flags:
    - -Wall
    - -Wextra
    - -Wpedantic
  debug_flags:
    - -g
    - -O0
  release_flags:
    - -O3
    - -DNDEBUG

structure:
  source_files: "*.cpp"
  header_files: "*.h, *.hpp"
  markdown_files: "*.md"
